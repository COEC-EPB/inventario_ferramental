<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Inventário de Materiais</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    margin:0;
    background:#F5F7FA;
    font-family:Segoe UI;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h1{
    color:#0097CE;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    border:none;
    cursor:pointer;
    border-radius:10px;
}

.btn{
    background:#0097CE;
    color:white;
    padding:15px 25px;
    font-weight:bold;
}

.btn-success{
    background:#28A745;
}

.btn-danger{
    background:#dc3545;
}

#inventarioArea{
    display:none;
}

.item{

    border:1px solid #E5E5E5;
    border-radius:15px;

    padding:20px;
    margin-bottom:15px;

}

.item h3{
    margin-top:0;
}

.item-grid{
    display:grid;
    grid-template-columns:180px 180px 1fr;
    gap:15px;
}

.status{
    font-weight:bold;
    margin-top:10px;
}

.ok{
    color:#28A745;
}

.divergencia{
    color:#DC3545;
}

.resumo{

    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

}

.resumo-card{

    background:white;

    border-radius:15px;

    padding:20px;

    text-align:center;
}

.numero{
    font-size:35px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
📋 Novo Inventário
</h1>

<br>

<div class="grid">

<div>
<label>Regional</label>
<select id="regional">
<option>CENTRO</option>
<option>LESTE</option>
<option>OESTE</option>
</select>
</div>

<div>
<label>Polo</label>
<select id="polo">
<option>JOÃO PESSOA</option>
<option>CAMPINA GRANDE</option>
</select>
</div>

<div>
<label>Base</label>
<select id="base">
<option>SEDE</option>
</select>
</div>

<div>
<label>Categoria</label>
<select id="categoria">
<option>EPI/EPC</option>
<option>FERRAMENTAL</option>
<option>TODOS</option>
</select>
</div>

</div>

<br>

<button
class="btn"
onclick="iniciarInventario()">

Iniciar Inventário

</button>

</div>

<div id="inventarioArea">

<div class="card">

<h2>
Materiais para Inventário
</h2>

<div id="listaMateriais">

</div>

<br>

<button
class="btn-success btn"
onclick="finalizarInventario()">

Finalizar Inventário

</button>

</div>

</div>

<div id="resultadoFinal"
style="display:none">

<div class="resumo">

<div class="resumo-card">

<div class="numero"
id="qtItens">
0
</div>

Itens

</div>

<div class="resumo-card">

<div class="numero"
id="qtConformes">
0
</div>

Conformes

</div>

<div class="resumo-card">

<div class="numero"
id="qtDivergencias">
0
</div>

Divergências

</div>

<div class="resumo-card">

<div class="numero"
id="acuracidade">
0%
</div>

Acuracidade

</div>

</div>

</div>

</div>

<script>

let materiais=[];

async function iniciarInventario(){

    const ok =
    confirm(

        "Deseja iniciar o inventário?"

    );

    if(!ok){
        return;
    }

    /*
      depois troca pelo endpoint
      API/equipamentos
    */

    materiais = [

        {
            codigo:"CAP001",
            nome:"Capacete Classe B",
            estoque:40
        },

        {
            codigo:"LUV001",
            nome:"Luva Vaqueta",
            estoque:22
        },

        {
            codigo:"BOT001",
            nome:"Botina Eletricista",
            estoque:15
        }

    ];

    document.getElementById(
        "inventarioArea"
    ).style.display="block";

    renderInventario();

}

function renderInventario(){

    const html =
    materiais.map((m,i)=>`

        <div class="item">

            <h3>
                ${m.nome}
            </h3>

            <div>
                Código:
                <b>${m.codigo}</b>
            </div>

            <br>

            <div class="item-grid">

                <div>

                    Sistema

                    <input
                    disabled
                    value="${m.estoque}">

                </div>

                <div>

                    Contado

                    <input
                    type="number"
                    id="contado_${i}"
                    value="${m.estoque}">

                </div>

                <div>

                    Observação

                    <input
                    id="obs_${i}">

                </div>

            </div>

        </div>

    `).join("");

    document
    .getElementById(
        "listaMateriais"
    )
    .innerHTML=html;

}

function finalizarInventario(){

    let divergencias=0;

    materiais.forEach(

        (m,i)=>{

            const contado =
            Number(

                document
                .getElementById(
                    `contado_${i}`
                ).value

            );

            if(
                contado !== m.estoque
            ){
                divergencias++;
            }

        }

    );

    const total =
    materiais.length;

    const conformes =
    total-divergencias;

    const acuracidade =
    (
        conformes/
        total
    )*100;

    document
    .getElementById(
        "resultadoFinal"
    )
    .style.display="block";

    document
    .getElementById(
        "qtItens"
    )
    .innerHTML=total;

    document
    .getElementById(
        "qtConformes"
    )
    .innerHTML=conformes;

    document
    .getElementById(
        "qtDivergencias"
    )
    .innerHTML=divergencias;

    document
    .getElementById(
        "acuracidade"
    )
    .innerHTML=
    acuracidade.toFixed(1)
    + "%";

}

</script>

</body>
</html>
